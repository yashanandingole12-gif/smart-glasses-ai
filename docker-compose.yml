version: '3.8'

services:
  eva-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eva_cloud_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-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}
    volumes:
      - eva_data:/app/data
      - eva_uploads:/app/uploads
      - eva_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - eva_net

  caddy:
    image: caddy:2-alpine
    container_name: eva_caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - eva-backend
    networks:
      - eva_net

volumes:
  eva_data:
  eva_uploads:
  eva_logs:
  caddy_data:
  caddy_config:

networks:
  eva_net:
    driver: bridge
