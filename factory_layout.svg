<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Virtual vehicle manufacturing factory layout</title>
  <desc id="desc">Top-down schematic factory with incoming materials, assembly halls, paint, testing, dispatch and moving vehicle lanes.</desc>
  <defs>
    <linearGradient id="hall" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e4edf7"/></linearGradient>
    <linearGradient id="road" x1="0" x2="1"><stop stop-color="#dbe6f2"/><stop offset="1" stop-color="#c4d4e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#64748b" flood-opacity=".20"/></filter>
    <style>
      .hall{fill:url(#hall);stroke:#52677e;stroke-width:3}.label{font-family:Arial,sans-serif;fill:#1e293b;font-size:24px;font-weight:700}.small{font-family:Arial,sans-serif;fill:#475569;font-size:16px}.line{fill:none;stroke:#7891aa;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#ffffff;stroke-width:3;stroke-dasharray:15 12}.robot{fill:#1d4ed8;stroke:#fff;stroke-width:3}.machine{fill:#64748b;stroke:#fff;stroke-width:2}.car{fill:#2563eb;stroke:#dbeafe;stroke-width:3}.wheel{fill:#0f172a}.tree{fill:#86a98b}.water{fill:#c9e3f2;stroke:#6c9bb7;stroke-width:3}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#eef3f8"/>
  <path class="water" d="M1190 0h210v760h-115c22-94-52-157-25-246 32-104 92-138 53-245-29-78-92-115-123-166z"/>
  <path class="line" d="M90 630 C240 600 260 520 410 560 S650 695 780 600 S970 465 1110 535 S1250 630 1330 560"/>
  <path class="dash" d="M90 630 C240 600 260 520 410 560 S650 695 780 600 S970 465 1110 535 S1250 630 1330 560"/>

  <g filter="url(#shadow)">
    <rect class="hall" x="75" y="70" width="275" height="180" rx="14"/><rect class="hall" x="380" y="70" width="340" height="180" rx="14"/><rect class="hall" x="750" y="70" width="285" height="180" rx="14"/>
    <rect class="hall" x="90" y="310" width="260" height="170" rx="14"/><rect class="hall" x="390" y="310" width="345" height="170" rx="14"/><rect class="hall" x="775" y="310" width="285" height="170" rx="14"/>
    <rect class="hall" x="170" y="530" width="270" height="130" rx="14"/><rect class="hall" x="530" y="530" width="270" height="130" rx="14"/><rect class="hall" x="890" y="530" width="250" height="130" rx="14"/>
  </g>

  <text class="label" x="105" y="112">RAW LOGISTICS</text><text class="small" x="105" y="140">Receiving + kitting</text><text class="label" x="420" y="112">BODY SHOP</text><text class="small" x="420" y="140">Chassis + panels</text><text class="label" x="790" y="112">WELDING</text><text class="small" x="790" y="140">Robotic weld cells</text>
  <text class="label" x="115" y="352">PAINTING</text><text class="small" x="115" y="380">Coating + curing</text><text class="label" x="415" y="352">POWERTRAIN</text><text class="small" x="415" y="380">Engine + drivetrain</text><text class="label" x="800" y="352">BATTERY / HV</text><text class="small" x="800" y="380">Electrical assembly</text>
  <text class="label" x="195" y="572">GENERAL ASSEMBLY</text><text class="small" x="195" y="600">Doors + interior</text><text class="label" x="555" y="572">QUALITY</text><text class="small" x="555" y="600">Vision inspection</text><text class="label" x="915" y="572">TEST + DISPATCH</text><text class="small" x="915" y="600">End of line</text>

  <g class="machine"><rect x="125" y="175" width="46" height="32" rx="4"/><rect x="195" y="175" width="46" height="32" rx="4"/><rect x="265" y="175" width="46" height="32" rx="4"/><rect x="455" y="175" width="50" height="32" rx="4"/><rect x="545" y="175" width="50" height="32" rx="4"/><rect x="635" y="175" width="50" height="32" rx="4"/></g>
  <g class="robot"><circle cx="835" cy="185" r="19"/><circle cx="925" cy="185" r="19"/><circle cx="1010" cy="185" r="19"/><circle cx="470" cy="425" r="19"/><circle cx="650" cy="425" r="19"/></g>
  <g class="car"><rect x="1120" y="225" width="82" height="38" rx="17"/><circle class="wheel" cx="1140" cy="268" r="9"/><circle class="wheel" cx="1183" cy="268" r="9"/><rect x="1080" y="615" width="82" height="38" rx="17"/><circle class="wheel" cx="1100" cy="658" r="9"/><circle class="wheel" cx="1143" cy="658" r="9"/></g>
  <g><circle class="tree" cx="1210" cy="320" r="20"/><circle class="tree" cx="1270" cy="360" r="20"/><circle class="tree" cx="1200" cy="450" r="20"/><circle class="tree" cx="1300" cy="500" r="20"/></g>
  <text class="small" x="1090" y="185">CONVEYOR / VEHICLE FLOW</text><path class="line" d="M1020 280h130v60H1050v80h130v80H1030"/><path class="dash" d="M1020 280h130v60H1050v80h130v80H1030"/>
</svg>
